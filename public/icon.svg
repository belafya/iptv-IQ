<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1f2b"/>
      <stop offset="100%" stop-color="#07080c"/>
    </radialGradient>
    
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#1a1c26"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="lightAura" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Background with Squircle safe-area border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Glowing Light Burst from top -->
  <circle cx="256" cy="120" r="140" fill="url(#lightAura)" />

  <!-- Flashlight Head / Bezel -->
  <path d="M176 170 L336 170 L306 250 L206 250 Z" fill="url(#bodyGrad)" stroke="#374151" stroke-width="4"/>
  
  <!-- Lens Glass & Glowing Flare -->
  <ellipse cx="256" cy="170" rx="80" ry="24" fill="url(#goldBeam)" filter="url(#glow)"/>
  <ellipse cx="256" cy="170" rx="50" ry="14" fill="#ffffff" />

  <!-- Flashlight Handle Body -->
  <rect x="216" y="250" width="80" height="150" rx="14" fill="url(#bodyGrad)" stroke="#2d3748" stroke-width="4"/>

  <!-- Grip Knurling Ribs -->
  <line x1="222" y1="280" x2="290" y2="280" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <line x1="222" y1="305" x2="290" y2="305" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <line x1="222" y1="330" x2="290" y2="330" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <line x1="222" y1="355" x2="290" y2="355" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>

  <!-- Tactile Power Button on Handle -->
  <rect x="238" y="300" width="36" height="46" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <!-- Power Icon in Button -->
  <path d="M256 310 L256 322 M247 318 A11 11 0 1 0 265 318" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Tail Cap -->
  <rect x="226" y="400" width="60" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="3"/>

  <!-- Light Beams Emitters -->
  <line x1="256" y1="130" x2="256" y2="60" stroke="#fef08a" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="200" y1="140" x2="150" y2="80" stroke="#fef08a" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="312" y1="140" x2="362" y2="80" stroke="#fef08a" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="150" y1="165" x2="90" y2="120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="362" y1="165" x2="422" y2="120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
