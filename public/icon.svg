<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- TV Frame Gradient -->
    <linearGradient id="tvFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- TV Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Play Accent Gradient -->
    <linearGradient id="playAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Antenna Signal Glow -->
    <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Antennas / Broadcast Waves at Top -->
  <!-- Left Antenna -->
  <line x1="190" y1="120" x2="256" y2="175" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.95"/>
  <circle cx="190" cy="120" r="10" fill="#ffffff"/>

  <!-- Right Antenna -->
  <line x1="322" y1="120" x2="256" y2="175" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.95"/>
  <circle cx="322" cy="120" r="10" fill="#ffffff"/>

  <!-- Center Antenna Junction -->
  <circle cx="256" cy="175" r="12" fill="#ffffff"/>

  <!-- TV Outer Body (Flat Modern Screen Housing) -->
  <rect x="68" y="165" width="376" height="236" rx="28" fill="url(#tvFrame)" />
  
  <!-- TV Inner Display Screen -->
  <rect x="86" y="183" width="340" height="190" rx="18" fill="url(#screenGrad)"/>

  <!-- Screen Content: Live Streaming Waves + Play Symbol -->
  <!-- Signal Arc 1 -->
  <path d="M195 240 A 60 60 0 0 0 195 316" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Signal Arc 2 -->
  <path d="M175 224 A 85 85 0 0 0 175 332" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-opacity="0.2"/>

  <!-- Central Modern Flat Play Triangle -->
  <polygon points="240,242 300,278 240,314" fill="url(#playAccent)" rx="6"/>
  <circle cx="270" cy="278" r="38" fill="url(#signalGlow)" pointer-events="none"/>
  <polygon points="240,242 300,278 240,314" fill="url(#playAccent)"/>

  <!-- "IQ" Live Badge on Top Right of Screen -->
  <rect x="354" y="197" width="56" height="24" rx="7" fill="#10b981"/>
  <text x="382" y="214" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">IQ</text>

  <!-- Live Pulse Dot -->
  <circle cx="106" cy="209" r="6" fill="#ef4444"/>
  <text x="120" y="213" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">LIVE</text>

  <!-- TV Flat Modern Stand / Base -->
  <!-- Left Leg -->
  <path d="M140 401 L110 440 L136 440 L156 401 Z" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Right Leg -->
  <path d="M372 401 L402 440 L376 440 L356 401 Z" fill="#ffffff" fill-opacity="0.95"/>
</svg>
